<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sneaker store</title>
</head>
<body>
    <link rel="stylesheet" href="style.css">
    <header>
        <span class="logo"><i><span class="sneaker">SNEAKER</span>STORE</i></span>
        <ul class="nav">
            <li>HOME</li>
            <li class="active">CATALOG</li>
            <li>MEN</li>
            <li>WOMEN</li>
            <li class="sale">SALE</li>
        </ul>
        <div class="upper-buttons">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="7" stroke="white" stroke-width="1.8"/>
            <path d="M16.5 16.5L21 21" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4" stroke="white" stroke-width="1.8"/>
            <path d="M4 20c0-3.5 3.5-6 8-6s8 2.5 8 6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 5h2l2.5 12h11l2-9H7" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="9" cy="20" r="1.6" fill="white"/>
            <circle cx="17" cy="20" r="1.6" fill="white"/>
            </svg>
        </div>
    </header>
    <div class="container">
        <div class="settings">
            <div class="filters">
                <p>FILTERS</p>
                <div class="settings-sign">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="4" y1="7" x2="20" y2="7" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="9" cy="7" r="2.2" fill="white"/>
                    <line x1="4" y1="12" x2="20" y2="12" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="15" cy="12" r="2.2" fill="white"/>
                    <line x1="4" y1="17" x2="20" y2="17" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="11" cy="17" r="2.2" fill="white"/>
                    </svg>
                </div>
            </div>
            <div class="prices">
                <p>PRICE RANGE</p>
                <div class="controler">-----------------</div>
            </div>
            <div class="brand">
                <p>BRAND</p>
                <ul class="brand-list">
                    <li>#  Nike</li>
                    <li>#  Adidas</li>
                    <li>#  Puma</li>
                </ul>
            </div>
            <div class="size">
                <p class="size-sign">SIZE</p>
                <div class="size-bank">
                    <div class="size-option">7</div>
                    <div class="size-option">7.5</div>
                    <div class="size-option">8</div>
                    <div class="size-option">8.5</div>
                    <div class="size-option">9</div>
                    <div class="size-option">9.5</div>
                    <div class="size-option">10</div>
                    <div class="size-option">10.5</div>
                    <div class="size-option">11</div>
                    <div class="size-option">11.5</div>
                    <div class="size-option">12</div>
                    <div class="size-option">13</div>
                </div>
            </div>
            <div class="filters-btn-wrapper">
                <button class="clear-filters">
                    <span class="text-cf">CLEAR FILTERS </span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 7h14" stroke="#FF3B30" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M9 7V5.5c0-.8.7-1.5 1.5-1.5h3c.8 0 1.5.7 1.5 1.5V7" stroke="#FF3B30" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M6.5 7l.8 12.5c.1.8.8 1.5 1.6 1.5h6.2c.8 0 1.5-.7 1.6-1.5L17.5 7" stroke="#FF3B30" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="10" y1="11" x2="10" y2="17" stroke="#FF3B30" stroke-width="1.6" stroke-linecap="round"/>
                        <line x1="14" y1="11" x2="14" y2="17" stroke="#FF3B30" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

        </div>
        <div class="items">
            <div class="results">
                <span class="display-results">Showing 6 results</span>
                <button class="sorting">Sort by: Popularity</button>
            </div>
            <div class="shoes">
                <div class="shoe-1">
                    <img class="blackshoe" src="pics/blackshoe.jpg"></img>
                    <div class="bs-info">#</div>
                </div>
                <div class="shoe-2">
                    <img class="whiteshoe" src="pics/whiteshoe.jpg"></img>
                    <div class="ws-info">#</div>
                </div>
                <div class="shoe-3">
                    <img class="redshoe" src="pics/redshoe.jpg"></img>
                    <div class="rs-info">#</div>
                </div>
                <div class="shoe-4">
                    <img class="greenshoe" src="pics/greenshoe.jpg"></img>
                    <div class="bs-info">#</div>
                </div>
                <div class="shoe-5">
                    <img class="grayshoe" src="pics/grayshoe.jpg"></img>
                    <div class="bs-info">#</div>
                </div>
                <div class="shoe-6">
                    <img class="blueshoe" src="pics/blueshoe.jpg"></img>
                    <div class="bs-info">#</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
