<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sneaker store</title>
</head>
<body>
    <link rel="stylesheet" href="style.css">
    <header>
        <span class="logo"><i><span class="sneaker">SNEAKER</span>STORE</i></span>
        <ul class="nav">
            <li>HOME</li>
            <li class="active">CATALOG</li>
            <li>MEN</li>
            <li>WOMEN</li>
            <li class="sale">SALE</li>
        </ul>
        <div class="upper-buttons">
            <div>#</div>
            <div>#</div>
            <div>#</div>
        </div>
    </header>
    <div class="container">
        <div class="settings">
            <div class="filters">
                <p>FILTERS</p>
                <div class="settings-sign">#</div>
            </div>
            <div class="prices">
                <p>PRICE RANGE</p>
                <div class="controler">-----------------</div>
            </div>
            <div class="brand">
                <p>BRAND</p>
                <ul class="brand-list">
                    <li>#  Nike</li>
                    <li>#  Adidas</li>
                    <li>#  Puma</li>
                </ul>
            </div>
            <div class="size">
                <p class="size-sign">SIZE</p>
                <div class="size-bank">
                    <div class="size-option">7</div>
                    <div class="size-option">7.5</div>
                    <div class="size-option">8</div>
                    <div class="size-option">8.5</div>
                    <div class="size-option">9</div>
                    <div class="size-option">9.5</div>
                    <div class="size-option">10</div>
                    <div class="size-option">10.5</div>
                    <div class="size-option">11</div>
                    <div class="size-option">11.5</div>
                    <div class="size-option">12</div>
                    <div class="size-option">13</div>
                </div>
            </div>
            <span class="btn">
            <button class="clear-filters">CLEAR FILTERS #</button>
            </span>
        </div>
        <div class="items">
            <div class="results">
                <span class="display-results">Showing 6 results</span>
                <button class="sorting">Sort by: Popularity</button>
            </div>
            <div class="shoes">
                <div class="shoe-1">
                    <img class="blackshoe" src="pics/blackshoe.jpg"></img>
                    <div class="bs-info">#</div>
                </div>
                <div class="shoe-2">
                    <img class="whiteshoe" src="pics/whiteshoe.jpg"></img>
                    <div class="ws-info">#</div>
                </div>
                <div class="shoe-3">
                    <img class="redshoe" src="pics/redshoe.jpg"></img>
                    <div class="rs-info">#</div>
                </div>
                <div class="shoe-4">
                    <img class="greenshoe" src="pics/greenshoe.jpg"></img>
                    <div class="bs-info">#</div>
                </div>
                <div class="shoe-5">
                    <img class="grayshoe" src="pics/grayshoe.jpg"></img>
                    <div class="bs-info">#</div>
                </div>
                <div class="shoe-6">
                    <img class="blueshoe" src="pics/blueshoe.jpg"></img>
                    <div class="bs-info">#</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
